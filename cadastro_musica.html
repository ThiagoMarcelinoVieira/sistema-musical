<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Música</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="page-header-bar">
        <h2>🎵Nova Música</h2>
        <div class="header-actions">
          <a href="cadastro_artista.html" class="btn-back"
            >⬅ Voltar para Artistas</a
          >
        </div>
      </div>

      <form action="#" method="post" enctype="multipart/form-data">
        <div class="form-grid">
          <div class="form-group">
            <label for="artista_id"
              >Artista <span style="color: var(--red)">*</span></label
            >
            <select name="artista_id" id="artista_id" required>
              <option value="">Selecione um Artista</option>
              <option value="1">Djavan</option>
              <option value="2">Emicida</option>
            </select>
          </div>

          <div class="form-group">
            <label for="titulo"
              >Título <span style="color: var(--red)">*</span></label
            >
            <input
              type="text"
              name="titulo"
              id="titulo"
              placeholder="Ex: Oceano, Aquarela..."
              required
            />
          </div>

          <div class="form-group">
            <label for="album">Álbum</label>
            <input
              type="text"
              name="album"
              id="album"
              placeholder="Ex: Luz (opcional)"
            />
          </div>

          <div class="form-group">
            <label for="genereo">Gênero</label>
            <input
              type="text"
              name="genero"
              id="genero"
              placeholder="Ex: MPB, Rock..."
            />
          </div>

          <div class="form-group">
            <label for="youtube_link"
              >Link do Youtube <span style="color: var(--red)">*</span></label
            >
            <input
              type="url"
              name="youtube_link"
              id="youtube_link"
              placeholder="https://www.youtube.com/watch?v=..."
              required
            />
            <small>Cole a URL do vídeo (não do canal ou playlist).</small>
          </div>

          <div class="form-group">
            <label for="imagem_capa">Capa do Álbum</label>
            <input type="file" id="imagem_capa" accept="image/*" />
            <small>JPG ou PNG • Máximo 5 MB</small>
          </div>

          <div class="form-group full">
            <label for="letra">Letra da Música</label>
            <textarea
              name="letra"
              id="letra"
              placeholder="Cole a letra aqui (opcional)..."
            ></textarea>
          </div>
        </div>
        <button class="btn-primary">➕ Cadastrar</button>
      </form>

      <h3>🎵 Músicas Cadastradas</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-capa">Capa</th>
              <th>Título</th>
              <th>Álbum</th>
              <th class="col-youtube">YouTube</th>
              <th class="col-acoes">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="no-image">Sem<br />capa</div>
              </td>
              <td>Oceano</td>
              <td>Luz</td>
              <td>
                <a href="#" target="_blank" class="btn-youtube">▶Assistir</a>
              </td>
              <td>
                <div class="action-buttons">
                  <a href="#" class="btn-edit">✏️Editar</a>
                  <a href="#" class="btn-delete">️🗑️</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
