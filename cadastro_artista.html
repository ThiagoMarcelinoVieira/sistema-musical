<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Artista</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="page-header-bar">
        <h2>🎤 Novo Artista</h2>
        <div class="header-actions">
          <a href="index.html" class="btn-back">⬅ Voltar ao Menu</a>
        </div>
      </div>

      <form method="post" action="#" enctype="multipart/form-data">
        <div class="form-grid">
          <div class="form-group">
            <label for="nome"
              >Nome do Artista <span style="color: var(--red)">*</span></label
            >
            <input
              type="text"
              name="nome"
              id="nome"
              required
              placeholder="Ex: Djavan, Marisa Monte..."
            />
          </div>

          <div class="form-group">
            <label for="genero">Gênero Musical</label>
            <input
              type="text"
              name="genero"
              id="genero"
              required
              placeholder="Ex: MPB, Rock, Samba..."
            />
          </div>

          <div class="form-group">
            <label for="pais">País</label>
            <input
              type="text"
              name="pais"
              id="pais"
              required
              placeholder="Ex: Brasil, EUA..."
            />
          </div>

          <div class="form-group">
            <label for="imagem">Foto do Artista</label>
            <input type="file" name="imagem" id="imagem" accept="image/*" />
            <small>JPG ou PNG • Máximo 5 MB</small>
          </div>
        </div>
        <button class="btn-primary">➕ Cadastrar</button>
      </form>

      <h3>📋 Artistas Cadastrados</h3>

      <div class="table-container">
        <!-- TABELA FAZER NO BACKEND -->
        <table>
          <thead>
            <tr>
              <th class="col-foto">Foto</th>
              <th>Nome</th>
              <th>Gênero</th>
              <th>País</th>
              <th class="col-acoes">Ações</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>
                <div class="no-image">Sem<br />foto</div>
              </td>
              <td>Djavan</td>
              <td>MPB</td>
              <td>Brasil</td>
              <td>
                <div class="action-buttons">
                  <a href="#" class="btn-edit">✏️Editar</a>
                  <a href="#" class="btn-delete">🗑️</a>
                  <a href="cadastro_musica.html" class="btn-music">♫ Músicas</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
