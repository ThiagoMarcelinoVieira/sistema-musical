<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Musical</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container listagem-musicas">
      <div class="page-header-bar">
        <h2>🎶 Biblioteca Musical</h2>
        <div class="header-actions">
          <a href="index.html" class="btn-back">⬅ Voltar ao Menu</a>
          <a href="cadastro_musica.html" class="btn-primary">➕ Nova Música</a>
        </div>
      </div>

      <div class="filters">
        <form method="get" class="filter-form" action="#">
          <div class="filter-group">
            <div class="filter-item">
              <label for="busca">Busca geral</label>
              <input
                type="text"
                name="busca"
                id="busca"
                placeholder="Título, álbum ou artista..."
              />
            </div>

            <div class="filter-item">
              <label for="artista">Artista</label>
              <select name="artista" id="artista">
                <option value="">Todos os artistas</option>
                <option value="1">Djavan</option>
              </select>
            </div>

            <div class="filter-item">
              <label for="genero">Gênero</label>
              <select name="genero" id="genero">
                <option value="">Todos os gêneros</option>
                <option value="1">Sertanejo</option>
              </select>
            </div>
          </div>
          <div class="filter-actions">
            <button type="submit" class="btn-primary">🔎Filtrar</button>
          </div>
        </form>
      </div>
      <div class="table-container">
        <!-- TABELA FAZER NO BACKEND -->
        <table>
          <thead>
            <tr>
              <th class="col-capa">Capa</th>
              <th>Título</th>
              <th>Artista</th>
              <th>Álbum</th>
              <th>Gênero</th>
              <th class="col-youtube">YouTube</th>
              <th class="col-acoes">Ações</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>
                <div class="no-image">Sem<br />capa</div>
              </td>
              <td>Oceano</td>
              <td>Djavan</td>
              <td>Luz</td>
              <td>MPB</td>
              <td>
                <a href="#" target="_blank" class="btn-youtube">▶Assistir</a>
              </td>
              <td>
                <div class="action-buttons">
                  <a href="#" class="btn-edit">✏️Editar</a>
                  <a href="#" class="btn-delete">🗑️</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
<!-- TABLE DENTRO DE FILTERS TIRAR -->
